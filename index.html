	<body>
		<noscript>You need to enable JavaScript to run this app.</noscript>
		<div
			id="error-console"
			style="
				position: fixed;
				top: 0;
				left: 0;
				width: 100%;
				height: 100vh;
				background: rgba(0, 0, 0, 0.8);
				color: lime;
				z-index: 99999;
				overflow: auto;
				font-family: monospace;
				padding: 20px;
				display: none;
				pointer-events: none;
			"
		></div>
		<script>
			window.onerror = function (msg, url, lineNo, columnNo, error) {
				var consoleDiv = document.getElementById("error-console");
				consoleDiv.style.display = "block";
				consoleDiv.innerHTML +=
					'<p style="margin-bottom:10px">🔴 <b>Error:</b> ' +
					msg +
					"<br>Line: " +
					lineNo +
					"</p>";
				return false;
			};

			window.onunhandledrejection = function (event) {
				var consoleDiv = document.getElementById("error-console");
				consoleDiv.style.display = "block";
				consoleDiv.innerHTML +=
					'<p style="margin-bottom:10px">🟠 <b>Promise:</b> ' +
					event.reason +
					"</p>";
			};
		</script>
		<div id="root"></div>
	</body>
</html>
